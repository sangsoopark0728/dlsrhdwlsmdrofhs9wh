<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🎵 Rhythm Game - Web Edition</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: white;
    font-family: 'Malgun Gothic', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    flex-direction: column;
  }
  h2 {
    color: #ffd700;
    text-shadow: 0 0 10px rgba(255,215,0,0.5);
    margin-bottom: 15px;
  }
  #game {
    position: relative;
    width: 480px;
    height: 700px;
    background: #000;
    border: 3px solid #555;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(100,150,255,0.5);
  }
  .lane {
    position: absolute;
    top: 0;
    width: 120px;
    height: 100%;
    border-right: 1px solid #333;
    background: rgba(255,255,255,0.02);
  }
  .lane.active {
    background: rgba(100,150,255,0.25);
  }
  #judgeLine {
    position: absolute;
    top: 620px;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, transparent, #ff4444, transparent);
    box-shadow: 0 0 15px #ff4444;
    z-index: 5;
  }
  .keyLabel {
    position: absolute;
    bottom: 20px;
    width: 120px;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: #aaa;
    z-index: 6;
  }
  .note {
    position: absolute;
    width: 110px;
    height: 22px;
    border-radius: 6px;
    left: 5px;
    box-shadow: 0 0 10px currentColor;
  }
  #info {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 10;
    font-size: 15px;
    background: rgba(0,0,0,0.5);
    padding: 8px 12px;
    border-radius: 6px;
    line-height: 1.6;
  }
  #judgeText {
    position: absolute;
    top: 40%;
    width: 100%;
    text-align: center;
    font-size: 44px;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
    text-shadow: 0 0 15px currentColor;
    z-index: 9;
  }
  #comboText {
    position: absolute;
    top: 30%;
    width: 100%;
    text-align: center;
    font-size: 28px;
    color: #ffd700;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
    z-index: 9;
  }
  #menu, #result {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    text-align: center;
    padding: 20px;
  }
  button {
    padding: 14px 28px;
    margin: 8px;
    font-size: 17px;
    background: linear-gradient(135deg, #4a90e2, #357abd);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: bold;
  }
  button:hover {
    background: linear-gradient(135deg, #6aaaff, #4a90e2);
    transform: scale(1.05);
  }
  h1 {
    color: #ffd700;
    text-shadow: 0 0 15px rgba(255,215,0,0.6);
  }
  .info-text {
    color: #aaa;
    margin-top: 20px;
    font-size: 14px;
  }
  #rankBadge {
    font-size: 80px;
    font-weight: bold;
    margin: 20px 0;
    text-shadow: 0 0 20px currentColor;
  }
</style>
</head>
<body>
<h2>🎵 Python DJ MAX - Web Edition 🎵</h2>
<div id="game">
  <div class="lane" id="lane0" style="left:0;"></div>
  <div class="lane" id="lane1" style="left:120px;"></div>
  <div class="lane" id="lane2" style="left:240px;"></div>
  <div class="lane" id="lane3" style="left:360px;"></div>
  <div id="judgeLine"></div>
  <div class="keyLabel" style="left:0;">D</div>
  <div class="keyLabel" style="left:120px;">F</div>
  <div class="keyLabel" style="left:240px;">J</div>
  <div class="keyLabel" style="left:360px;">K</div>
  <div id="info"></div>
  <div id="judgeText"></div>
  <div id="comboText"></div>

  <div id="menu">
    <h1>🎹 노래 선택</h1>
    <button onclick="startGame(0)">1. Beethoven - Für Elise</button>
    <button onclick="startGame(1)">2. Mozart - Eine kleine Nachtmusik</button>
    <p class="info-text">조작 키: D, F, J, K</p>
    <p class="info-text">🔊 소리가 안 들리면 브라우저 음량을 확인하세요</p>
  </div>

  <div id="result" style="display:none;">
    <h1>RESULT</h1>
    <div id="rankBadge"></div>
    <div id="resultDetail" style="font-size:17px; line-height:1.9;"></div>
    <button onclick="restartGame()">🔄 다시 하기</button>
  </div>
</div>

<script>
// ========== 음악 데이터 (음표: [주파수, 박자]) ==========
// 음표 → 주파수 변환
const NOTE_FREQ = {
  'C4':261.63,'C#4':277.18,'D4':293.66,'D#4':311.13,'E4':329.63,'F4':349.23,
  'F#4':369.99,'G4':392.00,'G#4':415.30,'A4':440.00,'A#4':466.16,'B4':493.88,
  'C5':523.25,'C#5':554.37,'D5':587.33,'D#5':622.25,'E5':659.25,'F5':698.46,
  'F#5':739.99,'G5':783.99,'G#5':830.61,'A5':880.00,'A#5':932.33,'B5':987.77,
  'C6':1046.50,'D6':1174.66,'E6':1318.51,
  'C3':130.81,'D3':146.83,'E3':164.81,'F3':174.61,'G3':196.00,'A3':220.00,'B3':246.94
};

// 엘리제를 위하여 (멜로디)
const furElise = [
  ['E5',0.25],['D#5',0.25],['E5',0.25],['D#5',0.25],['E5',0.25],['B4',0.25],['D5',0.25],['C5',0.25],
  ['A4',0.5],['C4',0.25],['E4',0.25],['A4',0.25],
  ['B4',0.5],['E4',0.25],['G#4',0.25],['B4',0.25],
  ['C5',0.5],['E4',0.25],['E5',0.25],['D#5',0.25],
  ['E5',0.25],['D#5',0.25],['E5',0.25],['B4',0.25],['D5',0.25],['C5',0.25],
  ['A4',0.5],['C4',0.25],['E4',0.25],['A4',0.25],
  ['B4',0.5],['E4',0.25],['C5',0.25],['B4',0.25],
  ['A4',0.75],['E5',0.25],['D#5',0.25],
  ['E5',0.25],['D#5',0.25],['E5',0.25],['B4',0.25],['D5',0.25],['C5',0.25],
  ['A4',0.5],['C4',0.25],['E4',0.25],['A4',0.25],
  ['B4',0.5],['E4',0.25],['G#4',0.25],['B4',0.25],
  ['C5',0.5],['E4',0.25],['E5',0.25],['D#5',0.25],
  ['E5',0.25],['D#5',0.25],['E5',0.25],['B4',0.25],['D5',0.25],['C5',0.25],
  ['A4',0.5],['C4',0.25],['E4',0.25],['A4',0.25],
  ['B4',0.5],['E4',0.25],['C5',0.25],['B4',0.25],
  ['A4',1.0]
];

// 아이네 클라이네 나흐트무지크 (작은 밤의 음악)
const nachtmusik = [
  ['G4',0.25],['D5',0.25],['G4',0.25],['D5',0.25],['G4',0.25],['D5',0.25],['G5',0.5],
  ['A5',0.25],['G5',0.25],['F#5',0.25],['G5',0.25],['A5',0.5],
  ['D4',0.25],['A4',0.25],['D4',0.25],['A4',0.25],['D4',0.25],['A4',0.25],['D5',0.5],
  ['E5',0.25],['D5',0.25],['C#5',0.25],['D5',0.25],['E5',0.5],
  ['G4',0.25],['D5',0.25],['G4',0.25],['D5',0.25],['G4',0.25],['D5',0.25],['G5',0.5],
  ['A5',0.25],['G5',0.25],['F#5',0.25],['G5',0.25],['A5',0.5],
  ['B4',0.25],['G5',0.25],['G5',0.25],['F#5',0.25],['F#5',0.25],['E5',0.25],['E5',0.25],['D5',0.25],
  ['C5',0.25],['B4',0.25],['A4',0.25],['G4',0.5],
  ['D5',0.5],['G5',0.5],['F#5',0.25],['E5',0.25],['D5',0.5],
  ['C5',0.5],['B4',0.5],['A4',0.5],['G4',0.5]
];

const songs = [
  { name: "Für Elise", melody: furElise, tempo: 0.35, color: "#ffb347" },
  { name: "Eine kleine Nachtmusik", melody: nachtmusik, tempo: 0.3, color: "#66ccff" }
];

const KEYS = ['d','f','j','k'];
const LANE_X = [0, 120, 240, 360];
const JUDGE_Y = 620;
const NOTE_SPEED = 400; // px/sec
const APPROACH_TIME = JUDGE_Y / NOTE_SPEED; // 노트가 위에서 판정선까지 걸리는 시간

let notes = [];
let perfect=0, good=0, bad=0, miss=0, combo=0, maxCombo=0, score=0;
let startTime, gameRunning=false, songData, songDuration=0;
let audioCtx = null;
const game = document.getElementById('game');

// ========== 오디오 재생 함수 ==========
function playTone(freq, startTime, duration) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.type = 'triangle'; // 피아노 비슷한 부드러운 음색
  osc.frequency.value = freq;
  
  // ADSR 엔벨로프 (피아노처럼)
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(0.3, startTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.15, startTime + 0.1);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration);
}

function scheduleMusic() {
  let t = audioCtx.currentTime + APPROACH_TIME; // 노트 떨어지는 시간만큼 지연
  songData.melody.forEach(([note, beat]) => {
    const dur = beat * songData.tempo * 4;
    if (NOTE_FREQ[note]) {
      playTone(NOTE_FREQ[note], t, dur * 0.95);
    }
    t += dur;
  });
}

// ========== 게임 로직 ==========
function startGame(idx) {
  // 초기화
  notes = [];
  perfect = good = bad = miss = 0;
  combo = maxCombo = score = 0;
  document.querySelectorAll('.note').forEach(n => n.remove());

  songData = songs[idx];
  document.getElementById('menu').style.display = 'none';
  document.getElementById('result').style.display = 'none';
  
  // 오디오 컨텍스트 초기화 (브라우저 정책상 사용자 클릭 후 생성)
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  
  generateNotesFromMelody();
  scheduleMusic();
  
  startTime = performance.now();
  gameRunning = true;
  requestAnimationFrame(loop);
}

function restartGame() {
  document.getElementById('result').style.display = 'none';
  document.getElementById('menu').style.display = 'flex';
}

// 멜로디 기반으로 노트 생성 (음악과 동기화)
function generateNotesFromMelody() {
  let t = APPROACH_TIME; // 음악이 시작되는 시간과 동일
  let lastLane = -1;
  songData.melody.forEach(([note, beat]) => {
    const dur = beat * songData.tempo * 4;
    // 너무 짧은 노트는 가끔 스킵해서 너무 빽빽하지 않게
    if (dur >= songData.tempo * 0.8) {
      let lane;
      // 음높이에 따라 레인 분배 (낮은음 → 왼쪽, 높은음 → 오른쪽)
      const freq = NOTE_FREQ[note] || 440;
      if (freq < 250) lane = 0;
      else if (freq < 400) lane = 1;
      else if (freq < 600) lane = 2;
      else lane = 3;
      // 같은 레인 연속 방지를 위해 가끔 섞기
      if (lane === lastLane && Math.random() < 0.5) {
        lane = (lane + 1) % 4;
      }
      notes.push({ lane, time: t, hit:false, missed:false, el:null });
      lastLane = lane;
    }
    t += dur;
  });
  songDuration = t + 1;
}

function showJudge(text, color) {
  const j = document.getElementById('judgeText');
  j.textContent = text;
  j.style.color = color;
  j.style.opacity = 1;
  clearTimeout(j._t);
  j._t = setTimeout(()=>{ j.style.opacity = 0; }, 400);

  if (combo > 1 && text !== "MISS" && text !== "BAD") {
    const c = document.getElementById('comboText');
    c.textContent = combo + " COMBO!";
    c.style.opacity = 1;
    clearTimeout(c._t);
    c._t = setTimeout(()=>{ c.style.opacity = 0; }, 400);
  }
}

function loop(now) {
  if (!gameRunning) return;
  const t = (now - startTime) / 1000;

  notes.forEach(n => {
    if (n.hit || n.missed) return;
    const dt = t - (n.time - APPROACH_TIME);
    const y = dt * NOTE_SPEED;
    if (y > -30 && !n.el) {
      n.el = document.createElement('div');
      n.el.className = 'note';
      n.el.style.background = songData.color;
      n.el.style.color = songData.color;
      n.el.style.left = (LANE_X[n.lane]+5)+'px';
      game.appendChild(n.el);
    }
    if (n.el) n.el.style.top = y + 'px';
    if (y > 720) {
      n.missed = true;
      miss++; combo = 0;
      showJudge("MISS", "#ff4444");
      if (n.el) n.el.remove();
    }
  });

  document.getElementById('info').innerHTML = 
    `🎵 ${songData.name}<br>💯 Score: ${score}<br>🔥 Combo: ${combo}<br>⏱️ ${Math.floor(t)}/${Math.floor(songDuration)}s`;

  if (t > songDuration + 2) {
    endGame();
    return;
  }
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
  if (!gameRunning) return;
  const key = e.key.toLowerCase();
  const lane = KEYS.indexOf(key);
  if (lane === -1) return;

  const laneEl = document.getElementById('lane'+lane);
  laneEl.classList.add('active');
  setTimeout(()=>laneEl.classList.remove('active'), 100);

  const t = (performance.now() - startTime) / 1000;
  let closest = null, closestDist = Infinity;
  notes.forEach(n => {
    if (n.lane === lane && !n.hit && !n.missed) {
      const dist = Math.abs(t - n.time);
      if (dist < closestDist) { closestDist = dist; closest = n; }
    }
  });

  if (closest && closestDist < 0.25) {
    closest.hit = true;
    if (closest.el) closest.el.remove();
    if (closestDist < 0.06) {
      perfect++; score += 300; combo++;
      showJudge("PERFECT", "#80ff80");
    } else if (closestDist < 0.14) {
      good++; score += 100; combo++;
      showJudge("GOOD", "#ffff80");
    } else {
      bad++; score += 50; combo = 0;
      showJudge("BAD", "#ff8080");
    }
    if (combo > maxCombo) maxCombo = combo;
  }
});

function endGame() {
  gameRunning = false;
  const total = perfect + good + bad + miss;
  const acc = total > 0 ? (perfect*100 + good*60 + bad*20) / (total*100) * 100 : 0;
  let rank = "D", rankColor = "#888";
  if (acc >= 95) { rank = "S"; rankColor = "#ffd700"; }
  else if (acc >= 85) { rank = "A"; rankColor = "#80ff80"; }
  else if (acc >= 70) { rank = "B"; rankColor = "#66ccff"; }
  else if (acc >= 50) { rank = "C"; rankColor = "#ffaa44"; }
  else { rank = "D"; rankColor = "#ff6666"; }

  const badge = document.getElementById('rankBadge');
  badge.textContent = rank;
  badge.style.color = rankColor;

  document.getElementById('resultDetail').innerHTML = `
    🎯 PERFECT: <b>${perfect}</b><br>
    👍 GOOD: <b>${good}</b><br>
    😐 BAD: <b>${bad}</b><br>
    ❌ MISS: <b>${miss}</b><br>
    🔥 MAX COMBO: <b>${maxCombo}</b><br>
    💯 SCORE: <b>${score}</b><br>
    🎼 정확도: <b>${acc.toFixed(1)}%</b>
  `;
  document.getElementById('result').style.display = 'flex';
}
</script>
</body>
</html>
