<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🎵 Rhythm Game - Web Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@400;700&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: linear-gradient(135deg, #0a0a1a 0%, #0d1b2a 50%, #091529 100%);
    color: white;
    font-family: 'Noto Sans KR', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    flex-direction: column;
    overflow: hidden;
  }
  /* BG animated stars */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 60%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 10%, rgba(255,255,255,0.25) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 80%, rgba(255,255,255,0.15) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 90%, rgba(255,255,255,0.2) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }
  h2 {
    color: #ffd700;
    font-family: 'Orbitron', monospace;
    font-size: 18px;
    letter-spacing: 3px;
    text-shadow: 0 0 15px rgba(255,215,0,0.7), 0 0 30px rgba(255,215,0,0.3);
    margin-bottom: 12px;
    z-index: 1;
  }
  #game {
    position: relative;
    width: 520px;
    height: 720px;
    background: #000;
    border: 2px solid #222;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(80,120,255,0.3), inset 0 0 40px rgba(0,0,0,0.8);
    z-index: 1;
  }
  /* Scanline effect */
  #game::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.08) 3px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 50;
  }
  .lane {
    position: absolute;
    top: 0;
    width: 130px;
    height: 100%;
    border-right: 1px solid #1a1a2e;
  }
  .lane.active { background: rgba(100,150,255,0.18); }
  /* Bottom bar */
  #bottomBar {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 90px;
    background: linear-gradient(to top, #050510, #0a0a20);
    border-top: 2px solid #222;
    z-index: 6;
  }
  .keyBtn {
    position: absolute;
    bottom: 10px;
    width: 110px;
    height: 60px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', monospace;
    font-size: 24px;
    font-weight: 900;
    border: 2px solid #333;
    background: linear-gradient(to bottom, #111, #0a0a0a);
    transition: all 0.08s;
    z-index: 7;
  }
  .keyBtn.pressed {
    background: linear-gradient(to bottom, #223, #112);
    border-color: #66f;
    box-shadow: 0 0 15px rgba(100,100,255,0.5);
    transform: translateY(2px);
  }
  #judgeLine {
    position: absolute;
    bottom: 90px;
    width: 100%;
    height: 3px;
    z-index: 5;
  }
  #judgeLine::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 5%, #ff3333 50%, transparent 95%);
    box-shadow: 0 0 12px #ff3333, 0 0 24px rgba(255,50,50,0.4);
  }
  /* Normal notes */
  .note {
    position: absolute;
    width: 110px;
    height: 24px;
    border-radius: 5px;
    left: 10px;
  }
  /* Long note body */
  .long-note-body {
    position: absolute;
    width: 110px;
    left: 10px;
    border-radius: 8px;
    opacity: 0.7;
  }
  /* Long note head */
  .long-note-head {
    position: absolute;
    width: 110px;
    height: 24px;
    border-radius: 5px;
    left: 10px;
  }
  /* Long note tail */
  .long-note-tail {
    position: absolute;
    width: 110px;
    height: 14px;
    border-radius: 3px;
    left: 10px;
    opacity: 0.6;
  }
  #info {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 10;
    font-size: 13px;
    background: rgba(0,0,0,0.7);
    padding: 8px 12px;
    border-radius: 6px;
    line-height: 1.7;
    font-family: 'Orbitron', monospace;
    border: 1px solid #222;
    backdrop-filter: blur(4px);
  }
  #judgeText {
    position: absolute;
    bottom: 140px;
    width: 100%;
    text-align: center;
    font-family: 'Orbitron', monospace;
    font-size: 38px;
    font-weight: 900;
    opacity: 0;
    transition: opacity 0.12s;
    pointer-events: none;
    letter-spacing: 3px;
    z-index: 9;
  }
  #comboText {
    position: absolute;
    bottom: 185px;
    width: 100%;
    text-align: center;
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    color: #ffd700;
    font-weight: 700;
    opacity: 0;
    transition: opacity 0.12s;
    pointer-events: none;
    letter-spacing: 2px;
    z-index: 9;
  }
  #progressBar {
    position: absolute;
    top: 0;
    left: 0;
    height: 3px;
    background: linear-gradient(90deg, #4466ff, #aa44ff);
    z-index: 15;
    transition: width 0.3s linear;
    box-shadow: 0 0 8px rgba(100,100,255,0.8);
  }
  #menu, #result {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    text-align: center;
    padding: 20px;
  }
  .menu-title {
    font-family: 'Orbitron', monospace;
    font-size: 28px;
    font-weight: 900;
    color: #ffd700;
    letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(255,215,0,0.6);
    margin-bottom: 30px;
  }
  .song-card {
    width: 400px;
    padding: 18px 24px;
    margin: 8px;
    background: linear-gradient(135deg, #0d1b2e, #111827);
    border: 1px solid #223;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .song-card:hover {
    border-color: #4466ff;
    box-shadow: 0 0 20px rgba(70,100,255,0.3);
    transform: translateX(4px);
  }
  .song-num {
    font-family: 'Orbitron', monospace;
    font-size: 28px;
    font-weight: 900;
    color: #4466ff;
    min-width: 40px;
  }
  .song-info { flex: 1; }
  .song-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .song-sub { font-size: 12px; color: #667; }
  .key-guide {
    margin-top: 24px;
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    color: #445;
    letter-spacing: 2px;
  }
  .key-guide span {
    display: inline-block;
    padding: 4px 10px;
    background: #111;
    border: 1px solid #333;
    border-radius: 4px;
    margin: 0 4px;
    color: #aaa;
  }
  button {
    padding: 14px 28px;
    margin: 8px;
    font-size: 15px;
    font-family: 'Orbitron', monospace;
    background: linear-gradient(135deg, #1a2a5e, #0d1b3e);
    color: #aac;
    border: 1px solid #334;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 700;
    letter-spacing: 2px;
  }
  button:hover {
    background: linear-gradient(135deg, #2a3a7e, #1a2a5e);

    border-color: #4466ff;

  }
  #rankBadge {
    font-family: 'Orbitron', monospace;
    font-size: 90px;
    font-weight: 900;
    margin: 15px 0;
    letter-spacing: 5px;
  }
  #resultDetail {
    font-size: 15px;
    line-height: 2;
    font-family: 'Orbitron', monospace;
    color: #aab;
    letter-spacing: 1px;
  }
  /* Long note holding glow effect */
  .holding-glow {
    position: absolute;
    width: 110px;
    height: 40px;
    left: 10px;
    border-radius: 5px;
    z-index: 8;
    animation: holdGlow 0.3s ease-in-out infinite alternate;
  }
  @keyframes holdGlow {
    from { opacity: 0.5; box-shadow: none; }
    to { opacity: 1; }
  }
  /* Lane dividers */
  .lane-divider {
    position: absolute;
    top: 0;
    width: 1px;
    height: 100%;
    background: linear-gradient(to bottom, transparent, rgba(40,40,80,0.5) 20%, rgba(40,40,80,0.5) 80%, transparent);
    z-index: 2;
    pointer-events: none;
  }
</style>

  ['A4',0.5],['C4',0.25],['E4',0.25],['A4',0.25],

  ['A4',0.5],['C4',0.25],['E4',0.25],['A4',0.25],

  // Section C - flowing arpeggios
  ['A4',0.25],['E5',0.25],['A5',0.25],['E5',0.25],
  ['A4',0.25],['E5',0.25],['A5',0.25],['E5',0.25],
  ['G#4',0.25],['E5',0.25],['G#5',0.25],['E5',0.25],

  // Theme A final
  ['E5',0.25],['D#5',0.25],['E5',0.25],['D#5',0.25],['E5',0.25],['B4',0.25],['D5',0.25],['C5',0.25],
  ['A4',0.5],['C4',0.25],['E4',0.25],['A4',0.25],

  ['E5',0.25],['D#5',0.25],['E5',0.25],['B4',0.25],['D5',0.25],['C5',0.25],
  ['A4',0.5],['C4',0.25],['E4',0.25],['A4',0.25],
  ['B4',0.5],['E4',0.25],['C5',0.25],['B4',0.25],

// ===== Eine kleine Nachtmusik - Extended to ~60s =====
const nachtmusik = [
  // Main theme
  ['G4',0.25],['D5',0.25],['G4',0.25],['D5',0.25],['G4',0.25],['D5',0.25],['G5',0.5],
  ['A5',0.25],['G5',0.25],['F#5',0.25],['G5',0.25],['A5',0.5],
  ['D4',0.25],['A4',0.25],['D4',0.25],['A4',0.25],['D4',0.25],['A4',0.25],['D5',0.5],
  ['E5',0.25],['D5',0.25],['C#5',0.25],['D5',0.25],['E5',0.5],
  ['G4',0.25],['D5',0.25],['G4',0.25],['D5',0.25],['G4',0.25],['D5',0.25],['G5',0.5],
  ['A5',0.25],['G5',0.25],['F#5',0.25],['G5',0.25],['A5',0.5],
  ['B4',0.25],['G5',0.25],['G5',0.25],['F#5',0.25],['F#5',0.25],['E5',0.25],['E5',0.25],['D5',0.25],

  ['D5',0.5],['G5',0.5],['F#5',0.25],['E5',0.25],['D5',0.5],

  ['F#5',0.25],['G5',0.25],['A5',0.25],['D5',0.5],
  ['E5',0.25],['F#5',0.25],['G5',0.25],['A5',0.25],['B5',0.5],
  // Running passage
  ['G5',0.125],['F#5',0.125],['E5',0.125],['D5',0.125],['C5',0.125],['B4',0.125],['A4',0.125],['G4',0.125],
  ['F#4',0.125],['G4',0.125],['A4',0.125],['B4',0.125],['C5',0.125],['D5',0.125],['E5',0.125],['F#5',0.125],
  // Main theme repeat
  ['G4',0.25],['D5',0.25],['G4',0.25],['D5',0.25],['G4',0.25],['D5',0.25],['G5',0.5],
  ['A5',0.25],['G5',0.25],['F#5',0.25],['G5',0.25],['A5',0.5],
  ['D4',0.25],['A4',0.25],['D4',0.25],['A4',0.25],['D4',0.25],['A4',0.25],['D5',0.5],
  ['E5',0.25],['D5',0.25],['C#5',0.25],['D5',0.25],['E5',0.5],
  // Coda
  ['G5',0.25],['F#5',0.25],['E5',0.25],['D5',0.25],['C5',0.25],['B4',0.25],['A4',0.25],['G4',0.25],
  ['G4',0.5],['D5',0.5],['G5',1.0],

const songs = [
  { name: "Für Elise", composer:"Beethoven", melody: furElise, tempo: 0.32, color: "#ffaa33", longColor: "#ff7700" },
  { name: "Eine kleine Nachtmusik", composer:"Mozart", melody: nachtmusik, tempo: 0.28, color: "#44aaff", longColor: "#0066cc" }
];

const KEYS = ['d','f','j','k'];
const LANE_X = [0, 130, 260, 390];
const JUDGE_Y = 630; // distance from top to judgeLine (game height - bottomBar)
const NOTE_SPEED = 420;
const APPROACH_TIME = JUDGE_Y / NOTE_SPEED;

// note object: { lane, time, endTime(for long), isLong, hit, missed, el, bodyEl, tailEl, holding, holdScore }
let notes = [];
let perfect=0, good=0, bad=0, miss=0, combo=0, maxCombo=0, score=0;
let startTime, gameRunning=false, songData, songDuration=0;
let audioCtx = null;
let holdingState = [false, false, false, false]; // per lane
let holdingGlow = [null, null, null, null];
const game = document.getElementById('game');

function playTone(freq, startAt, duration) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, startAt);
  gain.gain.linearRampToValueAtTime(0.28, startAt + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.12, startAt + 0.12);
  gain.gain.exponentialRampToValueAtTime(0.001, startAt + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(startAt);
  osc.stop(startAt + duration);
}

function scheduleMusic() {
  let t = audioCtx.currentTime + APPROACH_TIME;
  songData.melody.forEach(([note, beat]) => {
    const dur = beat * songData.tempo * 4;
    if (NOTE_FREQ[note]) playTone(NOTE_FREQ[note], t, dur * 0.9);
    t += dur;
  });
}

// Generate notes from melody with long notes mixed in
function generateNotesFromMelody() {
  let t = APPROACH_TIME;
  let lastLane = -1;
  let noteIndex = 0;

  songData.melody.forEach(([note, beat], i) => {
    const dur = beat * songData.tempo * 4;
    const minDur = songData.tempo * 0.7;

    if (dur >= minDur) {
      const freq = NOTE_FREQ[note] || 440;
      let lane;
      if (freq < 260) lane = 0;
      else if (freq < 400) lane = 1;
      else if (freq < 600) lane = 2;
      else lane = 3;

      if (lane === lastLane && Math.random() < 0.45) {
        lane = (lane + 1) % 4;
      }

      // Long note decision: notes with beat >= 0.5 have 35% chance; beat >= 0.75 have 60%
      const isLong = beat >= 0.5 && (
        (beat >= 0.75 && Math.random() < 0.6) ||
        (beat >= 0.5 && Math.random() < 0.35)
      );

      const endTime = isLong ? t + dur * 0.85 : null;

      notes.push({
        lane, time: t, endTime, isLong,
        hit: false, missed: false,
        el: null, bodyEl: null, tailEl: null, headEl: null,
        holding: false, holdReleased: false,
        holdScore: 0
      });
      lastLane = lane;
      noteIndex++;
    }
    t += dur;
  });
  songDuration = t + 1;
}

function createNoteElements(n, gameEl, color, longColor) {
  if (n.isLong) {
    // Calculate pixel height of long note body
    const bodyHeight = (n.endTime - n.time) * NOTE_SPEED;
    // Body
    const body = document.createElement('div');
    body.className = 'long-note-body';
    body.style.height = bodyHeight + 'px';
    body.style.background = `linear-gradient(to bottom, ${longColor}cc, ${longColor}44)`;
    body.style.border = `1px solid ${longColor}99`;
    body.style.boxShadow = `0 0 8px ${longColor}66`;
    gameEl.appendChild(body);
    n.bodyEl = body;

    // Head (top of long note)
    const head = document.createElement('div');
    head.className = 'long-note-head';
    head.style.background = `linear-gradient(90deg, ${color}, #fff, ${color})`;
    head.style.boxShadow = `0 0 14px ${color}, 0 0 6px #fff`;
    gameEl.appendChild(head);
    n.headEl = head;

    // Tail
    const tail = document.createElement('div');
    tail.className = 'long-note-tail';
    tail.style.background = longColor;
    tail.style.boxShadow = `0 0 6px ${longColor}`;
    gameEl.appendChild(tail);
    n.tailEl = tail;
  } else {
    const el = document.createElement('div');
    el.className = 'note';
    el.style.background = `linear-gradient(90deg, ${color}88, #fff, ${color}88)`;
    el.style.boxShadow = `0 0 12px ${color}, 0 0 4px #fff`;
    el.style.left = (LANE_X[n.lane] + 10) + 'px';
    gameEl.appendChild(el);
    n.el = el;
  }
}

function getNoteY(time, currentT) {
  return (currentT - (time - APPROACH_TIME)) * NOTE_SPEED;
}

function startGame(idx) {
  notes = [];
  perfect = good = bad = miss = 0;
  combo = maxCombo = score = 0;
  holdingState = [false, false, false, false];
  holdingGlow = [null, null, null, null];

  // Remove any leftover DOM
  document.querySelectorAll('.note, .long-note-body, .long-note-head, .long-note-tail, .holding-glow').forEach(n => n.remove());

  songData = songs[idx];
  document.getElementById('menu').style.display = 'none';
  document.getElementById('result').style.display = 'none';

  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  generateNotesFromMelody();
  scheduleMusic();
  startTime = performance.now();
  gameRunning = true;
  requestAnimationFrame(loop);
}

function restartGame() {
  document.getElementById('result').style.display = 'none';
  document.getElementById('menu').style.display = 'flex';
}

function showJudge(text, color) {
  const j = document.getElementById('judgeText');
  j.textContent = text;
  j.style.color = color;
  j.style.textShadow = `0 0 20px ${color}`;
  j.style.opacity = 1;
  clearTimeout(j._t);
  j._t = setTimeout(() => { j.style.opacity = 0; }, 420);

  if (combo > 1 && text !== 'MISS' && text !== 'BAD') {
    const c = document.getElementById('comboText');
    c.textContent = combo + ' COMBO';
    c.style.opacity = 1;
    clearTimeout(c._t);
    c._t = setTimeout(() => { c.style.opacity = 0; }, 420);
  }
}

function loop(now) {
  if (!gameRunning) return;
  const t = (now - startTime) / 1000;

  notes.forEach(n => {
    // Skip notes that are fully done (either cleanly hit/completed, or already missed)
    if (n.done) return;

    const headY = getNoteY(n.time, t);
    const laneLeft = LANE_X[n.lane];

    // Spawn elements when note enters visible area
    if (headY > -60 && !n.el && !n.headEl) {
      createNoteElements(n, game, songData.color, songData.longColor);
    }

    if (n.isLong) {
      // Helper to clean up all long note DOM
      const removeLongDom = () => {
        if (n.headEl) { n.headEl.remove(); n.headEl = null; }
        if (n.bodyEl) { n.bodyEl.remove(); n.bodyEl = null; }
        if (n.tailEl) { n.tailEl.remove(); n.tailEl = null; }
        holdingState[n.lane] = false;
        if (holdingGlow[n.lane]) { holdingGlow[n.lane].remove(); holdingGlow[n.lane] = null; }
      };

      if (n.hit && !n.holdReleased) {
        if (!n.headEl) { n.done = true; return; }
        // Being held — shrink body upward as tail approaches judge line
        const tailY = getNoteY(n.endTime, t);

        // Pin head at judge line while holding
        n.headEl.style.top = (JUDGE_Y - 24) + 'px';
        n.headEl.style.left = (laneLeft + 10) + 'px';

        if (tailY < JUDGE_Y - 24) {
          // Body still visible above judge line
          const bodyH = Math.max(0, (JUDGE_Y - 24) - tailY);
          n.bodyEl.style.top = tailY + 'px';
          n.bodyEl.style.height = bodyH + 'px';
          n.bodyEl.style.left = (laneLeft + 10) + 'px';
          n.tailEl.style.top = tailY + 'px';
          n.tailEl.style.left = (laneLeft + 10) + 'px';
          if (n.bodyEl) n.bodyEl.style.display = 'block';
          if (n.tailEl) n.tailEl.style.display = 'block';
        } else {
          // Tail has reached judge line → complete!
          n.holdReleased = true;
          n.done = true;
          score += 200;
          removeLongDom();
          showJudge('GREAT!', '#80ffff');
        }
        return;
      }

      if (!n.hit) {
        if (!n.headEl) return;
        // Not yet hit — scroll downward normally
        const tailY = getNoteY(n.endTime, t);
        const bodyH = Math.max(0, headY - tailY);

        n.headEl.style.top = headY + 'px';
        n.headEl.style.left = (laneLeft + 10) + 'px';
        n.bodyEl.style.top = tailY + 'px';
        n.bodyEl.style.height = bodyH + 'px';
        n.bodyEl.style.left = (laneLeft + 10) + 'px';
        n.tailEl.style.top = tailY + 'px';
        n.tailEl.style.left = (laneLeft + 10) + 'px';

        // Miss: head passed judge line without being hit
        if (headY > JUDGE_Y + 20) {
          n.done = true;
          n.missed = true;
          miss++; combo = 0;
          showJudge('MISS', '#ff4444');
          removeLongDom();
        }
      }

    } else {
      // Normal note
      if (!n.el) return;
      n.el.style.top = headY + 'px';
      n.el.style.left = (laneLeft + 10) + 'px';

      // Miss: head more than 20px past judge line without being hit
      if (headY > JUDGE_Y + 20 && !n.hit) {
        n.done = true;
        n.missed = true;
        miss++; combo = 0;
        showJudge('MISS', '#ff4444');
        n.el.remove();
        n.el = null;
      }
    }
  });

  // Update holding glow positions
  for (let lane = 0; lane < 4; lane++) {
    if (holdingState[lane] && holdingGlow[lane]) {
      holdingGlow[lane].style.top = (JUDGE_Y - 20) + 'px';
      holdingGlow[lane].style.left = (LANE_X[lane] + 10) + 'px';
      holdingGlow[lane].style.boxShadow = `0 0 20px ${songData.color}, 0 0 40px ${songData.color}88`;
      holdingGlow[lane].style.background = `${songData.color}33`;
    }
  }

  // Progress bar
  const progress = Math.min(100, (t / songDuration) * 100);
  document.getElementById('progressBar').style.width = progress + '%';

  document.getElementById('info').innerHTML =
    `🎵 ${songData.name}<br>SCORE: ${score}<br>COMBO: ${combo}<br>${Math.floor(t)}s / ${Math.floor(songDuration)}s`;

  if (t > songDuration + 2) {
    endGame(); return;
  }
  requestAnimationFrame(loop);
}

// Key press handling
document.addEventListener('keydown', e => {
  if (!gameRunning) return;
  const key = e.key.toLowerCase();
  const lane = KEYS.indexOf(key);
  if (lane === -1 || e.repeat) return;

  document.getElementById('btn' + lane).classList.add('pressed');
  document.getElementById('lane' + lane).classList.add('active');

  const t = (performance.now() - startTime) / 1000;

  // Find closest unhit note in lane
  let closest = null, closestDist = Infinity;
  notes.forEach(n => {
    if (n.lane === lane && !n.hit && !n.done) {
      const dist = Math.abs(t - n.time);
      if (dist < closestDist) { closestDist = dist; closest = n; }
    }
  });

  if (closest && closestDist < 0.28) {
    closest.hit = true;

    if (closest.isLong) {
      // Start holding
      holdingState[lane] = true;

      // Create glow element at judge line
      const glow = document.createElement('div');
      glow.className = 'holding-glow';
      game.appendChild(glow);
      holdingGlow[lane] = glow;

      if (closestDist < 0.07) {
        perfect++; score += 300; combo++;
        showJudge('PERFECT', '#80ff80');
      } else if (closestDist < 0.16) {
        good++; score += 100; combo++;
        showJudge('GOOD', '#ffff80');
      } else {
        bad++; score += 50; combo = 0;
        showJudge('BAD', '#ff8080');
      }

    } else {
      if (closest.el) { closest.el.remove(); closest.el = null; }
      closest.done = true;
      if (closestDist < 0.07) {
        perfect++; score += 300; combo++;
        showJudge('PERFECT', '#80ff80');
      } else if (closestDist < 0.16) {
        good++; score += 100; combo++;
        showJudge('GOOD', '#ffff80');
      } else {
        bad++; score += 50; combo = 0;
        showJudge('BAD', '#ff8080');
      }
    }
    if (combo > maxCombo) maxCombo = combo;
  }
});

document.addEventListener('keyup', e => {
  if (!gameRunning) return;
  const key = e.key.toLowerCase();
  const lane = KEYS.indexOf(key);
  if (lane === -1) return;

  document.getElementById('btn' + lane).classList.remove('pressed');
  setTimeout(() => document.getElementById('lane' + lane).classList.remove('active'), 80);

  if (holdingState[lane]) {
    holdingState[lane] = false;
    if (holdingGlow[lane]) { holdingGlow[lane].remove(); holdingGlow[lane] = null; }

    // Check if released early (mark note as failed)
    const t = (performance.now() - startTime) / 1000;
    notes.forEach(n => {
      if (n.lane === lane && n.hit && !n.holdReleased && !n.done && n.isLong) {
        const remaining = n.endTime - t;
        if (remaining > 0.15) {
          // Released too early — clean up DOM and mark as missed
          n.holdReleased = true;
          n.done = true;
          n.missed = true;
          if (n.headEl) { n.headEl.remove(); n.headEl = null; }
          if (n.bodyEl) { n.bodyEl.remove(); n.bodyEl = null; }
          if (n.tailEl) { n.tailEl.remove(); n.tailEl = null; }
          combo = 0;
          showJudge('MISS', '#ff4444');
        }
      }
    });
  }
});

function endGame() {
  gameRunning = false;
  const total = perfect + good + bad + miss;
  const acc = total > 0 ? (perfect * 100 + good * 60 + bad * 20) / (total * 100) * 100 : 0;
  let rank = 'D', rankColor = '#888';
  if (acc >= 95) { rank = 'S'; rankColor = '#ffd700'; }
  else if (acc >= 85) { rank = 'A'; rankColor = '#80ff80'; }
  else if (acc >= 70) { rank = 'B'; rankColor = '#66ccff'; }
  else if (acc >= 50) { rank = 'C'; rankColor = '#ffaa44'; }

  const badge = document.getElementById('rankBadge');
  badge.textContent = rank;
  badge.style.color = rankColor;
  badge.style.textShadow = `0 0 30px ${rankColor}`;

  document.getElementById('resultDetail').innerHTML = `
    PERFECT: <b style="color:#80ff80">${perfect}</b><br>
    GOOD: <b style="color:#ffff80">${good}</b><br>
    BAD: <b style="color:#ff8080">${bad}</b><br>
    MISS: <b style="color:#ff4444">${miss}</b><br>
    MAX COMBO: <b style="color:#ffd700">${maxCombo}</b><br>
    SCORE: <b style="color:white">${score}</b><br>
    ACCURACY: <b style="color:white">${acc.toFixed(1)}%</b>
  `;
  document.getElementById('result').style.display = 'flex';
}
</script>
