<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALAGA — 갤러그</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
    user-select: none;
  }

  #gameWrapper {
    position: relative;
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  #sidebar {
    color: #fff;
    font-size: 9px;
    line-height: 2.2;
    width: 120px;
  }

  #sidebar .label { color: #ffcc00; font-size: 7px; letter-spacing: 1px; }
  #sidebar .value { color: #fff; font-size: 13px; }
  #sidebar hr { border: none; border-top: 1px solid #333; margin: 10px 0; }

  #lives-display { display: flex; gap: 6px; margin-top: 4px; }
  .life-icon {
    width: 14px; height: 14px;
    background: #00e5ff;
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  }

  canvas {
    display: block;
    border: 1px solid #1a1a2e;
    image-rendering: pixelated;
  }

  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  #overlay h1 {
    font-size: 28px;
    color: #ffcc00;
    letter-spacing: 4px;
    text-shadow: 0 0 20px #ff6600;
    margin-bottom: 8px;
  }

  #overlay .sub {
    font-size: 8px;
    color: #888;
    letter-spacing: 2px;
    margin-bottom: 40px;
  }

  #overlay .msg {
    font-size: 10px;
    color: #00e5ff;
    animation: blink 1s step-end infinite;
    letter-spacing: 2px;
  }

  #overlay .score-display {
    font-size: 9px;
    color: #aaa;
    margin-bottom: 10px;
  }

  #overlay .hi-score {
    font-size: 11px;
    color: #ffcc00;
    margin-bottom: 30px;
  }

  @keyframes blink { 50% { opacity: 0; } }

  #controls-hint {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    color: #333;
    font-size: 6px;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  #starfield {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: -1;
  }
</style>
</head>
<body>

<canvas id="starfield"></canvas>

<div id="gameWrapper">
  <div id="sidebar">
    <div class="label">SCORE</div>
    <div class="value" id="scoreDisplay">0</div>
    <hr>
    <div class="label">HI-SCORE</div>
    <div class="value" id="hiScoreDisplay">0</div>
    <hr>
    <div class="label">STAGE</div>
    <div class="value" id="stageDisplay">1</div>
    <hr>
    <div class="label">LIVES</div>
    <div id="lives-display"></div>
    <hr>
    <div class="label" style="margin-top:16px; color:#555;">CONTROLS</div>
    <div style="font-size:6px; color:#444; line-height:2.4; margin-top:4px;">
      ← → MOVE<br>
      SPACE FIRE<br>
      P PAUSE
    </div>
  </div>

  <div style="position:relative;">
    <canvas id="gameCanvas" width="380" height="560"></canvas>
    <div id="overlay">
      <h1>GALAGA</h1>
      <div class="sub">갤러그</div>
      <div class="score-display" id="overlayScore" style="display:none">SCORE: <span id="finalScore">0</span></div>
      <div class="hi-score" id="overlayHi" style="display:none">HI-SCORE: <span id="finalHi">0</span></div>
      <div class="msg" id="overlayMsg">PRESS SPACE TO START</div>
    </div>
    <div id="controls-hint">← → MOVE &nbsp;|&nbsp; SPACE FIRE &nbsp;|&nbsp; P PAUSE</div>
  </div>
</div>

<script>
/* ─── Starfield Background ─── */
(function(){
  const sc = document.getElementById('starfield');
  const sx = sc.getContext('2d');
  sc.width = window.innerWidth;
  sc.height = window.innerHeight;
  const stars = Array.from({length:200}, ()=>({
    x: Math.random()*sc.width,
    y: Math.random()*sc.height,
    s: Math.random()*1.5+0.3,
    sp: Math.random()*0.6+0.1,
    b: Math.random()
  }));
  function drawStars(){
    sx.fillStyle='#000';
    sx.fillRect(0,0,sc.width,sc.height);
    stars.forEach(s=>{
      sx.fillStyle=`rgba(255,255,255,${0.3+s.b*0.7})`;
      sx.fillRect(s.x,s.y,s.s,s.s);
      s.y+=s.sp;
      if(s.y>sc.height){s.y=0;s.x=Math.random()*sc.width;}
    });
    requestAnimationFrame(drawStars);
  }
  drawStars();
})();

/* ─── Game Engine ─── */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const overlay = document.getElementById('overlay');
const overlayMsg = document.getElementById('overlayMsg');
const overlayScore = document.getElementById('overlayScore');
const overlayHi = document.getElementById('overlayHi');
const finalScore = document.getElementById('finalScore');
const finalHi = document.getElementById('finalHi');
const scoreDisplay = document.getElementById('scoreDisplay');
const hiScoreDisplay = document.getElementById('hiScoreDisplay');
const stageDisplay = document.getElementById('stageDisplay');
const livesDisplay = document.getElementById('lives-display');

let gameState = 'title'; // title | playing | paused | dead | win | gameover
let score = 0, hiScore = parseInt(localStorage.getItem('galaga_hi')||'0');
let lives = 3, stage = 1;
let frameId;

/* ─── Input ─── */
const keys = {};
document.addEventListener('keydown', e=>{
  keys[e.code] = true;
  if(e.code==='Space') e.preventDefault();
  if(e.code==='KeyP' && gameState==='playing') togglePause();
  if(e.code==='Space'){
    if(gameState==='title'||gameState==='gameover'||gameState==='win') startGame();
    else if(gameState==='dead') revive();
  }
});
document.addEventListener('keyup', e=>{ keys[e.code]=false; });

/* ─── Player ─── */
let player, bullets, enemies, enemyBullets, particles, explosions;
let shootCooldown, enemyMoveDir, enemyMoveTimer, diveBombers, bossCapture;
let stageFormationDone, enemyDescending, introTimer;

function initStage(){
  shootCooldown = 0;
  enemyMoveDir = 1;
  enemyMoveTimer = 0;
  diveBombers = [];
  bossCapture = null;
  stageFormationDone = false;
  introTimer = 120;

  bullets = [];
  enemyBullets = [];
  particles = [];
  explosions = [];

  player = {
    x: W/2, y: H-60,
    w: 28, h: 28,
    speed: 4,
    captured: false,
    invincible: 0
  };

  enemies = buildFormation();
}

function buildFormation(){
  const list = [];
  const cols = 8, rows = 4;
  const startX = (W - cols*44)/2 + 14;
  const startY = 80;
  let idx = 0;

  for(let r=0; r<rows; r++){
    for(let c=0; c<cols; c++){
      const type = r===0 ? 'boss' : (r<=1 ? 'butterfly' : 'bee');
      list.push({
        x: startX + c*44,
        y: -100 - (rows-1-r)*50 + r*0, // fly in from top
        homeX: startX + c*44,
        homeY: startY + r*44,
        w: type==='boss'?26:20,
        h: type==='boss'?22:18,
        type,
        hp: type==='boss' ? 2 : 1,
        alive: true,
        entering: true,
        entryDelay: idx*3,
        entryT: 0,
        diving: false,
        diveT: 0,
        diveAngle: 0,
        shootTimer: Math.random()*180+60,
        frame: 0,
        frameT: 0
      });
      idx++;
    }
  }
  return list;
}

/* ─── Drawing Helpers ─── */
function drawPlayer(px, py, alpha=1){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(px, py);

  // body
  ctx.fillStyle='#00e5ff';
  ctx.beginPath();
  ctx.moveTo(0,-14);
  ctx.lineTo(6,-4);
  ctx.lineTo(14,8);
  ctx.lineTo(-14,8);
  ctx.lineTo(-6,-4);
  ctx.closePath();
  ctx.fill();

  // wings
  ctx.fillStyle='#0077aa';
  ctx.fillRect(-14,2,10,6);
  ctx.fillRect(4,2,10,6);

  // cockpit
  ctx.fillStyle='#aaefff';
  ctx.beginPath();
  ctx.ellipse(0,-4,3,5,0,0,Math.PI*2);
  ctx.fill();

  // engine glow
  ctx.fillStyle='rgba(255,200,0,0.8)';
  ctx.fillRect(-3,8,6,4);

  ctx.restore();
}

function drawBee(x, y, frame){
  ctx.save();
  ctx.translate(x, y);
  const flap = frame%2===0;

  ctx.fillStyle='#ffcc00';
  // body
  ctx.fillRect(-4,-8,8,16);
  ctx.fillStyle='#ff6600';
  ctx.fillRect(-3,-8,6,4);

  // wings
  ctx.fillStyle = flap ? 'rgba(255,200,0,0.9)' : 'rgba(255,200,0,0.5)';
  if(flap){
    ctx.fillRect(-10,-4,8,8);
    ctx.fillRect(2,-4,8,8);
  } else {
    ctx.fillRect(-8,0,6,8);
    ctx.fillRect(2,0,6,8);
  }

  // eyes
  ctx.fillStyle='#fff';
  ctx.fillRect(-3,-5,2,2);
  ctx.fillRect(1,-5,2,2);
  ctx.restore();
}

function drawButterfly(x, y, frame){
  ctx.save();
  ctx.translate(x, y);
  const flap = frame%2===0;

  ctx.fillStyle='#cc44ff';
  ctx.fillRect(-4,-8,8,16);

  ctx.fillStyle = flap ? 'rgba(180,50,255,0.9)' : 'rgba(180,50,255,0.4)';
  if(flap){
    ctx.beginPath();
    ctx.ellipse(-9,-2,7,10,0.3,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(9,-2,7,10,-0.3,0,Math.PI*2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.ellipse(-7,4,5,7,0.6,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(7,4,5,7,-0.6,0,Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle='#ff88ff';
  ctx.fillRect(-3,-7,6,4);
  ctx.restore();
}

function drawBoss(x, y, frame, hp){
  ctx.save();
  ctx.translate(x, y);
  const flap = frame%2===0;

  ctx.fillStyle = hp>1 ? '#ff2244' : '#aa1133';
  // main body
  ctx.beginPath();
  ctx.ellipse(0,0,13,11,0,0,Math.PI*2);
  ctx.fill();

  // wings
  ctx.fillStyle = flap ? 'rgba(255,50,80,0.9)' : 'rgba(255,50,80,0.4)';
  if(flap){
    ctx.beginPath();
    ctx.ellipse(-14,-2,10,12,0.2,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(14,-2,10,12,-0.2,0,Math.PI*2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.ellipse(-12,4,8,9,0.5,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(12,4,8,9,-0.5,0,Math.PI*2);
    ctx.fill();
  }

  // face
  ctx.fillStyle='#ffcc00';
  ctx.fillRect(-4,-4,3,3);
  ctx.fillRect(1,-4,3,3);
  ctx.fillStyle='#fff';
  ctx.fillRect(-3,-3,1,1);
  ctx.fillRect(2,-3,1,1);

  if(hp>1){
    ctx.fillStyle='rgba(255,150,0,0.6)';
    ctx.beginPath();
    ctx.arc(0,3,5,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawBullet(x, y, enemy=false){
  if(enemy){
    ctx.fillStyle='#ff4444';
    ctx.fillRect(x-2,y-6,4,12);
  } else {
    ctx.fillStyle='#00ffcc';
    ctx.shadowColor='#00ffcc';
    ctx.shadowBlur=6;
    ctx.fillRect(x-2,y-8,4,16);
    ctx.shadowBlur=0;
  }
}

function spawnParticles(x, y, color, count=12){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const sp=Math.random()*3+1;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:40+Math.random()*20,color,size:Math.random()*3+1});
  }
}

/* ─── Collision ─── */
function rectHit(ax,ay,aw,ah,bx,by,bw,bh){
  return ax-aw/2<bx+bw/2 && ax+aw/2>bx-bw/2 &&
         ay-ah/2<by+bh/2 && ay+ah/2>by-bh/2;
}

/* ─── Game Logic ─── */
function update(){
  if(gameState!=='playing') return;

  if(introTimer>0){ introTimer--; return; }

  shootCooldown = Math.max(0, shootCooldown-1);

  // player movement
  if(!player.captured){
    if(keys['ArrowLeft']||keys['KeyA']) player.x = Math.max(20, player.x-player.speed);
    if(keys['ArrowRight']||keys['KeyD']) player.x = Math.min(W-20, player.x+player.speed);
    if(keys['Space'] && shootCooldown===0){
      bullets.push({x:player.x, y:player.y-14, vy:-10});
      shootCooldown = 18;
    }
    if(player.invincible>0) player.invincible--;
  }

  // enemies entering formation
  let allHome = true;
  enemies.forEach(e=>{
    if(!e.alive) return;
    e.frameT++;
    if(e.frameT%12===0) e.frame++;

    if(e.entering){
      e.entryDelay--;
      if(e.entryDelay>0) return;
      e.entryT++;
      const t = e.entryT/80;
      if(t<1){
        e.x = e.homeX + Math.sin(t*Math.PI*2)*30*(1-t);
        e.y = e.homeY * t + (-100)*(1-t);
        allHome=false;
      } else {
        e.x = e.homeX;
        e.y = e.homeY;
        e.entering = false;
      }
    }
  });
  stageFormationDone = allHome;

  // formation movement
  if(stageFormationDone){
    enemyMoveTimer++;
    const speed = 0.4 + stage*0.1;
    const period = Math.max(60, 120 - stage*10);
    const offset = Math.sin(enemyMoveTimer/period*Math.PI)*24;

    enemies.forEach(e=>{
      if(!e.alive||e.diving) return;
      e.x = e.homeX + offset;
    });

    // random dives
    if(Math.random()<0.003+stage*0.001){
      const alive = enemies.filter(e=>e.alive&&!e.diving);
      if(alive.length>0){
        const pick = alive[Math.floor(Math.random()*alive.length)];
        pick.diving = true;
        pick.diveT = 0;
        pick.diveAngle = (player.x - pick.x > 0 ? 1 : -1) * (0.5+Math.random()*0.8);
        pick.diveStartX = pick.x;
        pick.diveStartY = pick.y;
      }
    }
  }

  // diving enemies
  enemies.forEach(e=>{
    if(!e.alive||!e.diving) return;
    e.diveT++;
    const sp = 2.5+stage*0.3;
    e.y += sp;
    e.x += e.diveAngle*sp;

    // enemy shooting
    e.shootTimer--;
    if(e.shootTimer<=0 && e.y>50 && e.y<H-50){
      enemyBullets.push({x:e.x, y:e.y+10, vx:(player.x-e.x)*0.03, vy:3+Math.random()});
      e.shootTimer = 60+Math.random()*80;
    }

    if(e.y>H+40){
      e.diving=false;
      e.x=e.homeX;
      e.y=e.homeY-40;
    }
  });

  // formation shooting (non-diving)
  if(stageFormationDone){
    enemies.forEach(e=>{
      if(!e.alive||e.diving) return;
      e.shootTimer--;
      if(e.shootTimer<=0){
        if(Math.random()<0.2){
          enemyBullets.push({x:e.x, y:e.y+10, vx:(player.x-e.x)*0.015, vy:2.5+Math.random()*1.5});
        }
        e.shootTimer = 100+Math.random()*200;
      }
    });
  }

  // player bullets
  bullets.forEach(b=>{ b.y+=b.vy; });
  bullets = bullets.filter(b=>b.y>-10);

  bullets.forEach(b=>{
    enemies.forEach(e=>{
      if(!e.alive||!rectHit(b.x,b.y,4,16,e.x,e.y,e.w,e.h)) return;
      e.hp--;
      b.y=-999;
      if(e.hp<=0){
        e.alive=false;
        const pts = e.type==='boss'?200:(e.type==='butterfly'?100:50);
        score+=pts;
        scoreDisplay.textContent=score;
        if(score>hiScore){ hiScore=score; hiScoreDisplay.textContent=hiScore; localStorage.setItem('galaga_hi',hiScore); }
        spawnParticles(e.x,e.y,e.type==='boss'?'#ff2244':(e.type==='butterfly'?'#cc44ff':'#ffcc00'),e.type==='boss'?20:12);
      } else {
        spawnParticles(e.x,e.y,'#ff8800',5);
      }
    });
  });

  // enemy bullets vs player
  if(player.invincible===0 && !player.captured){
    enemyBullets.forEach(b=>{
      if(rectHit(b.x,b.y,4,12,player.x,player.y,24,24)){
        b.vy=-999;
        killPlayer();
      }
    });

    // enemy collision
    enemies.forEach(e=>{
      if(!e.alive||!e.diving) return;
      if(rectHit(e.x,e.y,e.w-4,e.h-4,player.x,player.y,22,22)){
        spawnParticles(e.x,e.y,'#ff2244');
        e.alive=false;
        killPlayer();
      }
    });
  }

  enemyBullets.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; });
  enemyBullets = enemyBullets.filter(b=>b.y<H+10&&b.y>-10);

  // particles
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life--; });
  particles = particles.filter(p=>p.life>0);

  // check win
  if(enemies.every(e=>!e.alive)){
    stage++;
    stageDisplay.textContent=stage;
    gameState='win';
    overlayScore.style.display='block';
    overlayHi.style.display='block';
    finalScore.textContent=score;
    finalHi.textContent=hiScore;
    overlayMsg.textContent='STAGE CLEAR! PRESS SPACE';
    overlay.style.display='flex';
  }
}

function killPlayer(){
  lives--;
  updateLivesUI();
  spawnParticles(player.x,player.y,'#00e5ff',20);

  if(lives<=0){
    gameState='gameover';
    overlay.style.display='flex';
    overlayScore.style.display='block';
    overlayHi.style.display='block';
    finalScore.textContent=score;
    finalHi.textContent=hiScore;
    overlayMsg.textContent='GAME OVER — PRESS SPACE';
  } else {
    gameState='dead';
    overlay.style.display='flex';
    overlayScore.style.display='block';
    overlayHi.style.display='block';
    finalScore.textContent=score;
    finalHi.textContent=hiScore;
    overlayMsg.textContent='PRESS SPACE TO CONTINUE';
  }
}

function revive(){
  overlay.style.display='none';
  gameState='playing';
  player.x=W/2; player.y=H-60;
  player.invincible=120;
  introTimer=60;
  bullets=[];
  enemyBullets=[];
}

function updateLivesUI(){
  livesDisplay.innerHTML='';
  for(let i=0;i<lives;i++){
    const d=document.createElement('div');
    d.className='life-icon';
    livesDisplay.appendChild(d);
  }
}

/* ─── Render ─── */
function render(){
  ctx.clearRect(0,0,W,H);

  // grid lines subtle
  ctx.strokeStyle='rgba(0,50,80,0.15)';
  ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // enemies
  enemies.forEach(e=>{
    if(!e.alive) return;
    if(e.type==='bee') drawBee(e.x,e.y,e.frame);
    else if(e.type==='butterfly') drawButterfly(e.x,e.y,e.frame);
    else drawBoss(e.x,e.y,e.frame,e.hp);
  });

  // player bullets
  bullets.forEach(b=>drawBullet(b.x,b.y,false));

  // enemy bullets
  enemyBullets.forEach(b=>drawBullet(b.x,b.y,true));

  // particles
  particles.forEach(p=>{
    const a=p.life/60;
    ctx.globalAlpha=Math.min(a,1);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  });
  ctx.globalAlpha=1;

  // player
  if(!player.captured){
    const blink = player.invincible>0 && Math.floor(player.invincible/5)%2===0;
    if(!blink) drawPlayer(player.x, player.y, 1);
  }

  // intro countdown
  if(introTimer>0 && gameState==='playing'){
    ctx.fillStyle='rgba(0,229,255,0.8)';
    ctx.font='10px "Press Start 2P"';
    ctx.textAlign='center';
    const n=Math.ceil(introTimer/40);
    if(introTimer>30) ctx.fillText('STAGE '+stage, W/2, H/2);
    ctx.textAlign='left';
  }
}

/* ─── Game Loop ─── */
function loop(){
  update();
  render();
  frameId = requestAnimationFrame(loop);
}

function startGame(){
  score=0; lives=3; stage=1;
  scoreDisplay.textContent='0';
  hiScoreDisplay.textContent=hiScore;
  stageDisplay.textContent='1';
  updateLivesUI();
  initStage();
  gameState='playing';
  overlay.style.display='none';
  overlayScore.style.display='none';
  overlayHi.style.display='none';
  if(!frameId) loop();
}

function togglePause(){
  if(gameState==='playing'){
    gameState='paused';
    overlay.style.display='flex';
    overlayScore.style.display='none';
    overlayHi.style.display='none';
    overlayMsg.textContent='PAUSED — PRESS P';
  } else if(gameState==='paused'){
    gameState='playing';
    overlay.style.display='none';
  }
}

// Stage clear -> next stage
window.addEventListener('keydown', e=>{
  if(e.code==='Space' && gameState==='win'){
    initStage();
    gameState='playing';
    overlay.style.display='none';
    introTimer=120;
  }
});

// Init hi-score display
hiScoreDisplay.textContent=hiScore;
updateLivesUI();
loop();
</script>
